name: Release Pages Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Cloudflare Pages deployment files
        run: |
          mkdir -p dist
          cp index.html obfuscator.py dist/
          if [ -f _headers ]; then cp _headers dist/; fi
          cd dist
          zip -r ../pyobf-pages.zip ./*
          cd ..
          ls -la pyobf-pages.zip

      - name: Determine Tag Name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            echo "::error::Run this workflow from a tag or provide tag_name"; exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid tag format: $TAG (expected e.g. v1.0.0)"; exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: pyobf-pages.zip
          generate_release_notes: true
          draft: false
          prerelease: false
