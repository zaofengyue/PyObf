<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PyObf — 在线 Python 代码混淆工具</title>
<meta name="description" content="纯浏览器端运行的 Python 源码混淆工具：变量重命名、去除注释与文档字符串、字符串编码、代码压缩。基于 Pyodide (WebAssembly)，代码永不上传服务器。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d1117'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f2b705' font-family='monospace'%3E%7B%7D%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />

<style>
  :root{
    --bg:            #0d1117;
    --bg-raised:     #141a22;
    --panel:         #171d27;
    --border:        #262d3a;
    --border-soft:   #1e2531;
    --text:          #e7eaf0;
    --text-dim:      #8b93a6;
    --text-faint:    #5b6478;
    --amber:         #f2b705;
    --amber-dim:     #a67f0c;
    --amber-strong:  #f2b705;
    --teal:          #34d1a1;
    --red:           #ef5b5b;
    --radius:        10px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(242,183,5,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52,209,161,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:rgba(242,183,5,0.28); }
  a{ color:var(--amber); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:4px; }

  /* ---------- layout shell ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  header.top{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding:20px 0; border-bottom:1px solid var(--border-soft);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:.02em; }
  .brand .glyph{
    width:30px; height:30px; border-radius:8px; background:linear-gradient(145deg,#1c2330,#12161e);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:var(--amber); font-size:15px; vertical-align:middle;
  }
  .brand .tagline{ font-family:var(--sans); font-weight:400; font-size:13px; color:var(--text-faint); }
  .top-right{ display:flex; align-items:center; gap:18px; }
  nav.top-links{ display:flex; align-items:center; gap:20px; font-size:14px; color:var(--text-dim); }
  nav.top-links a{ color:var(--text-dim); }
  nav.top-links a:hover{ color:var(--amber); }
  .gh-btn{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border); padding:7px 12px;
    border-radius:8px; color:var(--text) !important; font-size:13px; font-family:var(--mono);
  }
  .gh-btn:hover{ border-color:var(--amber-dim); text-decoration:none; }

  /* ---------- section titles ---------- */
  section{ padding:28px 0 44px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .section-head h2{ font-family:var(--mono); font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:0; font-weight:600; }
  #status{ font-family:var(--mono); font-size:12.5px; color:var(--text-faint); display:flex; align-items:center; gap:8px; }
  #status .led{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); flex:none; }
  #status.loading .led{ background:var(--amber-strong); animation:pulse 1s ease-in-out infinite; }
  #status.ready .led{ background:var(--teal); }
  #status.error .led{ background:var(--red); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* ---------- options toolbar ---------- */
  .toolbar{
    display:flex; flex-direction:column; gap:14px;
    padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--panel); margin-bottom:16px;
  }
  .toolbar-row{ display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; }
  .controls-row{ justify-content:space-between; }
  .controls-left{ display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; }
  .controls-right{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-left:auto; }
  .opt{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--text); user-select:none; }
  .opt input[type=checkbox]{ accent-color:var(--amber-strong); width:15px; height:15px; }
  .opt.select-opt{ gap:8px; }
  select, input[type=number]{
    background:var(--bg-raised); border:1px solid var(--border); color:var(--text);
    font-family:var(--mono); font-size:12.5px; padding:5px 8px; border-radius:6px;
  }
  input[type=number]{ width:60px; }
  .btn{
    font-family:var(--mono); font-size:13px; font-weight:600; border-radius:8px; border:1px solid transparent;
    padding:9px 16px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .05s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--amber-strong); color:#151206; }
  .btn-primary:hover{ background:#ffcb2e; }
  .btn-primary:disabled{ background:var(--amber-dim); color:#151206; opacity:.55; cursor:progress; }
  .btn-ghost{ background:transparent; border-color:var(--border); color:var(--text); }
  .btn-ghost:hover{ border-color:var(--amber-dim); color:var(--amber); }
  .btn-sm{ padding:6px 11px; font-size:12px; }

  /* ---------- workspace ---------- */
  .workspace{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width: 900px){ .workspace{ grid-template-columns:1fr; } }
  .pane{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--panel); display:flex; flex-direction:column; }
  .pane-head{
    display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    border-bottom:1px solid var(--border-soft); background:var(--bg-raised);
  }
  .pane-head h3{ margin:0; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }
  .pane-head .actions{ display:flex; gap:8px; }
  .CodeMirror{ height:420px !important; font-family:var(--mono) !important; font-size:13px !important; line-height:1.55 !important; }
  .CodeMirror-gutters{ border-right:1px solid var(--border-soft) !important; }

  .stats-row{
    display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; padding:10px 14px;
    border-top:1px solid var(--border-soft); font-family:var(--mono); font-size:12px; color:var(--text-dim);
  }
  .stats-row b{ color:var(--text); }
  .stats-row .shrink{ color:var(--teal); }
  .stats-row .grow{ color:var(--amber); }

  .warnings{ margin:14px 0 0; padding:12px 14px; border:1px solid rgba(242,183,5,0.35); background:rgba(242,183,5,0.06); border-radius:8px; font-size:13px; color:#f4d27a; }
  .warnings b{ display:block; margin-bottom:4px; color:var(--amber); font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
  .errorbox{ margin:14px 0 0; padding:12px 14px; border:1px solid rgba(239,91,91,0.4); background:rgba(239,91,91,0.08); border-radius:8px; font-size:13px; color:#ff9d9d; font-family:var(--mono); white-space:pre-wrap; }

  footer{ border-top:1px solid var(--border-soft); padding:26px 0 40px; color:var(--text-faint); font-size:12.5px; }
  footer .wrap{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  footer a{ color:var(--text-dim); }
  footer a:hover{ color:var(--amber); }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="glyph">{}</span> PyObf <span class="tagline">纯浏览器端 Python 代码混淆工具</span></div>
    <div class="top-right">
      <div id="status" class="loading"><span class="led"></span><span id="statusText">正在加载 Python 运行时 (Pyodide)…</span></div>
      <a class="gh-btn" href="https://github.com/zaofengyue/pyobf" target="_blank" rel="noopener">
        ★ GitHub
      </a>
    </div>
  </header>

  <section id="workspace">
    <div class="toolbar">
      <div class="toolbar-row options-row">
        <label class="opt"><input type="checkbox" id="optRename" checked /> 重命名局部变量</label>
        <label class="opt"><input type="checkbox" id="optDoc" checked /> 移除注释 / 文档字符串</label>
        <label class="opt"><input type="checkbox" id="optStr" checked /> 编码字符串 (Base64 + XOR 动态混淆)</label>
        <label class="opt"><input type="checkbox" id="optNum" checked /> 数值与布尔混淆 (位运算/算术等价)</label>
        <label class="opt"><input type="checkbox" id="optJunk" checked /> 注入干扰死代码与不透明谓词</label>
        <label class="opt"><input type="checkbox" id="optCompact" checked /> 压缩缩进为 1 空格</label>
        <label class="opt" title="若部署到生产服务器且开启了云安全防护，建议关闭此项以避免误报"><input type="checkbox" id="optPayload" checked /> 打包为单行 exec (加载器模式)</label>
      </div>

      <div class="toolbar-row controls-row">
        <div class="controls-left">
          <label class="opt select-opt">
            命名风格
            <select id="optStyle">
              <option value="hex">_0x1a2b (十六进制)</option>
              <option value="letters">_abcdef (字母)</option>
              <option value="il1">Il1lI (易混淆)</option>
            </select>
          </label>
          <label class="opt select-opt">
            名称长度
            <input type="number" id="optLength" min="4" max="16" value="6" />
          </label>
          <label class="opt select-opt">
            随机种子
            <input type="number" id="optSeed" placeholder="可选" />
          </label>
        </div>

        <div class="controls-right">
          <button class="btn btn-ghost btn-sm" id="btnExample">加载示例</button>
          <button class="btn btn-ghost btn-sm" id="btnClear">清空</button>
          <button class="btn btn-primary" id="btnRun" disabled>▶ 混淆代码</button>
        </div>
      </div>
    </div>

    <div class="workspace">
      <div class="pane">
        <div class="pane-head">
          <h3>原始代码 · input.py</h3>
          <div class="actions"><button class="btn btn-ghost btn-sm" id="btnPasteInfo" title="直接在编辑器里粘贴/编辑即可">✎ 可编辑</button></div>
        </div>
        <textarea id="inputEditor"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <h3>混淆结果 · obfuscated.py</h3>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" id="btnCopy">复制</button>
            <button class="btn btn-ghost btn-sm" id="btnDownload">下载 .py</button>
          </div>
        </div>
        <textarea id="outputEditor"></textarea>
        <div class="stats-row" id="statsRow" style="display:none;">
          <span>原始大小 <b id="statOrig">–</b></span>
          <span>混淆后 <b id="statObf">–</b></span>
          <span id="statDelta"></span>
        </div>
      </div>
    </div>

    <div id="warningsBox"></div>
    <div id="errorBox"></div>
  </section>
</div>

<footer>
  <div class="wrap">
    <span>PyObf · MIT License · 混淆引擎源码见 <a href="obfuscator.py" target="_blank">obfuscator.py</a></span>
    <span>源码托管于 <a href="https://github.com/zaofengyue/pyobf" target="_blank" rel="noopener">GitHub</a> · 可部署到 Cloudflare Pages / AlwaysData / CT8</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.3/full/pyodide.js"></script>

<script>
(function(){
  "use strict";

  const EXAMPLE = `"""A tiny demo module."""
import math


class Circle:
    """A circle shape."""

    def __init__(self, radius):
        self.radius = radius  # store the radius

    def area(self):
        """Return the circle's area."""
        r = self.radius
        result = math.pi * r ** 2
        return result


def greet(name, times=1):
    # say hello a few times
    message = f"Hello, {name}!"
    output = []
    for i in range(times):
        output.append(message)
    return output


if __name__ == "__main__":
    c = Circle(3)
    print(c.area())
    for line in greet("World", 2):
        print(line)
`;

  const inputCM = CodeMirror.fromTextArea(document.getElementById('inputEditor'), {
    mode: 'python', theme: 'material-darker', lineNumbers: true, indentUnit: 4,
    tabSize: 4, indentWithTabs: false, viewportMargin: Infinity, lineWrapping: false,
  });
  const outputCM = CodeMirror.fromTextArea(document.getElementById('outputEditor'), {
    mode: 'python', theme: 'material-darker', lineNumbers: true, readOnly: true,
    viewportMargin: Infinity, lineWrapping: false,
  });
  inputCM.setValue(EXAMPLE);

  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const btnRun = document.getElementById('btnRun');
  const warningsBox = document.getElementById('warningsBox');
  const errorBox = document.getElementById('errorBox');
  const statsRow = document.getElementById('statsRow');

  function setStatus(kind, text){
    statusEl.className = kind;
    statusText.textContent = text;
  }

  function getOptions(){
    const seedVal = document.getElementById('optSeed').value;
    const numChecked = document.getElementById('optNum').checked;
    return {
      rename_locals: document.getElementById('optRename').checked,
      strip_docstrings: document.getElementById('optDoc').checked,
      encode_strings: document.getElementById('optStr').checked,
      string_xor: true,
      encode_numbers: numChecked,
      encode_booleans: numChecked,
      insert_junk: document.getElementById('optJunk').checked,
      compact_indent: document.getElementById('optCompact').checked,
      payload_mode: document.getElementById('optPayload').checked,
      payload_reverse: true,
      name_style: document.getElementById('optStyle').value,
      name_length: parseInt(document.getElementById('optLength').value || '6', 10),
      seed: seedVal === '' ? null : parseInt(seedVal, 10),
    };
  }

  function humanSize(n){
    if (n < 1024) return n + ' B';
    return (n/1024).toFixed(1) + ' KB';
  }

  let pyodide = null;

  async function initPyodide(){
    try{
      pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.3/full/' });
      const resp = await fetch('obfuscator.py', { cache: 'no-store' });
      if (!resp.ok) throw new Error('无法加载 obfuscator.py (HTTP ' + resp.status + ')');
      const code = await resp.text();
      pyodide.runPython(code);
      setStatus('ready', 'Pyodide 就绪 · 引擎已加载');
      btnRun.disabled = false;
    } catch (err){
      console.error(err);
      setStatus('error', '加载失败：' + err.message);
    }
  }

  function callObfuscate(source, options){
    pyodide.globals.set('__pyobf_input_source', source);
    pyodide.globals.set('__pyobf_options_json', JSON.stringify(options));
    const resultJson = pyodide.runPython(`
import json as __pyobf_json
__pyobf_opts = __pyobf_json.loads(__pyobf_options_json)
__pyobf_result = safe_obfuscate(__pyobf_input_source, __pyobf_opts)
__pyobf_json.dumps(__pyobf_result)
`);
    return JSON.parse(resultJson);
  }

  function runObfuscation(){
    if (!pyodide) return;
    const source = inputCM.getValue();
    warningsBox.innerHTML = '';
    errorBox.innerHTML = '';
    if (!source.trim()){
      outputCM.setValue('');
      statsRow.style.display = 'none';
      return;
    }
    let result;
    try{
      result = callObfuscate(source, getOptions());
    } catch (err){
      errorBox.innerHTML = '<div class="errorbox"><b>JS/Pyodide 错误</b>\\n' + escapeHtml(String(err)) + '</div>';
      return;
    }
    if (result.error){
      outputCM.setValue('');
      statsRow.style.display = 'none';
      errorBox.innerHTML = '<div class="errorbox">' + escapeHtml(result.error) + '</div>';
      return;
    }
    outputCM.setValue(result.code);
    document.getElementById('statOrig').textContent = humanSize(result.original_size);
    document.getElementById('statObf').textContent = humanSize(result.obfuscated_size);
    const deltaEl = document.getElementById('statDelta');
    const diff = result.obfuscated_size - result.original_size;
    deltaEl.textContent = (diff >= 0 ? '增大 +' : '减小 ') + humanSize(Math.abs(diff));
    deltaEl.className = diff >= 0 ? 'grow' : 'shrink';
    statsRow.style.display = 'flex';
    if (result.warnings && result.warnings.length){
      warningsBox.innerHTML = '<div class="warnings"><b>提示</b>' + result.warnings.map(escapeHtml).join('<br>') + '</div>';
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('btnRun').addEventListener('click', runObfuscation);
  document.getElementById('btnExample').addEventListener('click', () => inputCM.setValue(EXAMPLE));
  document.getElementById('btnClear').addEventListener('click', () => { inputCM.setValue(''); outputCM.setValue(''); statsRow.style.display='none'; warningsBox.innerHTML=''; errorBox.innerHTML=''; });
  document.getElementById('btnCopy').addEventListener('click', async () => {
    const text = outputCM.getValue();
    if (!text) return;
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('btnCopy');
    const old = btn.textContent; btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1200);
  });
  document.getElementById('btnDownload').addEventListener('click', () => {
    const text = outputCM.getValue();
    if (!text) return;
    const blob = new Blob([text], { type: 'text/x-python' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'obfuscated.py';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  initPyodide();
})();
</script>
</body>
</html>
